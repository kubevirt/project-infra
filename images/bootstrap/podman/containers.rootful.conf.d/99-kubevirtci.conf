# Reference documentation:
# - https://github.com/podman-container-tools/container-libs/blob/main/common/docs/containers.conf.5.md
# - https://github.com/podman-container-tools/podman/blob/main/vendor/go.podman.io/common/pkg/config/containers.conf
# - https://github.com/podman-container-tools/image_build/blob/main/podman/containers.conf

[containers]
netns="private"
userns="host"
ipcns="host"
utsns="private"
cgroupns="host"
cgroups="enabled"
log_driver="k8s-file"
# Required for kubevirt unit-tests
pids_limit=8192

[engine]
cgroup_manager="cgroupfs"
events_logger="file"
runtime="crun"
network_cmd_options=[
  "mtu=1450",
  "enable_ipv6=true",
]
