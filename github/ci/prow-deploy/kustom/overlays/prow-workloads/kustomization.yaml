---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resources/bootstrap.yaml
  - resources/shared-images-controller.yaml
  - resources/priority-classes.yaml
  - resources/sriov-passthrough-ds.yaml
  - ../../components/docker-mirror-proxy/base

components:
  - ../../components/docker-mirror-proxy/hostpath

patches:
  - target: &deployment_target
      group: apps
      version: v1
      kind: Deployment
      name: docker-mirror-proxy
    path: patches/JsonRFC6902/docker_mirror_deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: github-token
    namespace: kubevirt-prow-jobs
    files:
      - appid=secrets/github/app-id
      - cert=secrets/github/app-secret
      # For backward compatibility
      - oauth=secrets/github/bot-token
      - token=secrets/github/bot-token
    type: Opaque
  - name: gcs-credentials
    namespace: kubevirt-prow-jobs
    files:
      - secrets/service-account.json
    type: Opaque
  - name: bazel-cache-gcs
    namespace: kubevirt-prow-jobs
    files:
      - secrets/prow/google/service-accounts/bazel-cache/bazel-cache-sa.json
    type: Opaque

  - name: kubevirtci-quay-credential
    namespace: kubevirt-prow-jobs
    files:
      - secrets/kubevirtci-quay-credential/username
      - secrets/kubevirtci-quay-credential/password
      - secrets/kubevirtci-quay-credential/token
    type: Opaque

  - name: quay-kubevirt-push
    namespace: kubevirt-prow-jobs
    files:
      - secrets/quay-kubevirt-push/username
      - secrets/quay-kubevirt-push/password
    type: Opaque

  - name: quay-kubevirtci-push
    namespace: kubevirt-prow-jobs
    files:
      - secrets/quay-kubevirtci-push/username
      - secrets/quay-kubevirtci-push/password
    type: Opaque

  - name: quay-containerdisks-push
    namespace: kubevirt-prow-jobs
    files:
      - secrets/quay-containerdisks-push/username
      - secrets/quay-containerdisks-push/password
    type: Opaque

  - name: commenter-oauth-token
    namespace: kubevirt-prow-jobs
    # githubCommenterToken
    files:
      - oauth=secrets/commenter-oauth-token
    type: Opaque
  - name: kubevirtci-coveralls-token
    namespace: kubevirt-prow-jobs
    files:
      - token=secrets/kubevirtci-coveralls-token
    type: Opaque
  - name: containerized-data-importer-coveralls-token
    namespace: kubevirt-prow-jobs
    files:
      - token=secrets/containerized-data-importer-coveralls-token
    type: Opaque
  - name: win-sysprep-001
    namespace: kubevirt-prow-jobs
    files:
      - productKey=secrets/win-sysprep-001
    type: Opaque
  - name: kubevirtci-fossa-token
    namespace: kubevirt-prow-jobs
    files:
      - token=secrets/kubevirtci-fossa-token
    type: Opaque
