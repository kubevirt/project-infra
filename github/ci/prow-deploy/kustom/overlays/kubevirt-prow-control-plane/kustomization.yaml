---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../components/docker-mirror-proxy/base
  - resources/crier-rbac.yaml
  - resources/deck-rbac.yaml
  - resources/docker-mirror-proxy_pvc.yaml
  - resources/hook-rbac.yaml
  - resources/horologium-rbac.yaml
  - resources/prow-controller-manager-rbac.yaml
  - resources/prow-exporter-deployment.yaml
  - resources/prow-exporter-rbac.yaml
  - resources/prow-exporter-service.yaml
  - resources/sinker-rbac.yaml
  - resources/statusreconciler-rbac.yaml
  - resources/tide-rbac.yaml

components:
  - ../../components/docker-mirror-proxy/pv

patches:
  - target: &deployment_target
      version: v1
      group: apps
      kind: Deployment
      name: rehearse
    path: patches/JsonRFC6902/prow-rehearse-deployment.yaml
  - target:
      <<: *deployment_target
      name: test-subset
    path: patches/JsonRFC6902/test-subset-deployment.yaml
  - target:
      <<: *deployment_target
      name: gcsweb
    path: patches/JsonRFC6902/gcsweb-deployment.yaml
  - target:
      <<: *deployment_target
      name: deck
    path: patches/JsonRFC6902/deck_deployment.yaml
  - target:
      <<: *deployment_target
      name: hook
    path: patches/JsonRFC6902/hook_deployment.yaml
  - target:
      <<: *deployment_target
      name: horologium
    path: patches/JsonRFC6902/horologium_deployment.yaml
  - target:
      <<: *deployment_target
      name: statusreconciler
    path: patches/JsonRFC6902/statusreconciler_deployment.yaml
  - target:
      <<: *deployment_target
      name: tide
    path: patches/JsonRFC6902/tide_deployment.yaml
  - target:
      <<: *deployment_target
      name: cherrypicker
    path: patches/JsonRFC6902/cherrypicker_deployment.yaml
  - target:
      <<: *deployment_target
      name: crier
    path: patches/JsonRFC6902/crier_deployment.yaml
  - target:
      <<: *deployment_target
      name: prow-controller-manager
    path: patches/JsonRFC6902/prow_controller_manager_deployment.yaml
  - target:
      <<: *deployment_target
      name: sinker
    path: patches/JsonRFC6902/sinker_deployment.yaml
  - target:
      <<: *deployment_target
      name: pushgateway
    path: patches/JsonRFC6902/pushgateway_deployment.yaml
  - target:
      <<: *deployment_target
      name: pushgateway-proxy
    path: patches/JsonRFC6902/pushgateway_proxy_deployment.yaml
  - target: &ingress_target
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: prow
    path: patches/JsonRFC6902/prow_ingress.yaml
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: ghproxy
    path: patches/StrategicMerge/ghproxy.yaml
  - target:
      <<: *deployment_target
      name: docker-mirror-proxy
    path: patches/JsonRFC6902/docker_mirror_deployment.yaml

  # namespaces
  - target:
      <<: *deployment_target
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *deployment_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target: &pvc_target
      version: v1
      kind: PersistentVolumeClaim
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *pvc_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target: &service_target
      version: v1
      kind: Service
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *service_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target: &configmap_target
      version: v1
      kind: ConfigMap
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *configmap_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target: &serviceaccount_target
      version: v1
      kind: ServiceAccount
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *serviceaccount_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target: &role_target
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *role_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *role_target
      namespace: test-pods
      name: .*
    path: patches/JsonRFC6902/prow-jobs-namespace.yaml
  - target: &rolebinding_target
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *rolebinding_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *rolebinding_target
      namespace: test-pods
      name: .*
    path: patches/JsonRFC6902/prow-jobs-namespace.yaml
  - target: &clusterrolebinding_target
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: prow-rehearse
    path: patches/JsonRFC6902/rolebinding-subject-prow-namespace.yaml
  - target:
      <<: *clusterrolebinding_target
      name: test-subset
    path: patches/JsonRFC6902/rolebinding-subject-prow-namespace.yaml
  - target:
      <<: *rolebinding_target
      namespace: test-pods
      name: .*
    path: patches/JsonRFC6902/rolebinding-subject-prow-namespace.yaml
  - target:
      <<: *role_target
      namespace: test-pods
      name: deck
    path: patches/JsonRFC6902/prow-jobs-rolebinding-rules.yaml
  - target:
      <<: *ingress_target
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      <<: *ingress_target
      namespace: prow
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      version: v1
      kind: Secret
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml
  - target:
      group: batch
      version: v1
      kind: CronJob
      namespace: default
      name: .*
    path: patches/JsonRFC6902/prow-namespace.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: config
    files:
      - configs/config/config.yaml
  - name: label-config
    files:
      - configs/labels/labels.yaml
  - name: plugins
    files:
      - configs/plugins/plugins.yaml

secretGenerator:
  - &github_token
    name: github-token
    files:
      - appid=secrets/prow/github/app-id
      - cert=secrets/prow/github/app-secret
      # For backward compatibility
      - oauth=secrets/prow/github/bot-token
      - token=secrets/prow/github/bot-token
    type: Opaque
  - <<: *github_token
    namespace: kubevirt-prow-jobs
  - &gcs_credentials
    name: gcs-credentials
    files:
      - service-account.json=secrets/tokens/google/service-accounts/prow/prow-sa.json
    type: Opaque
  - <<: *gcs_credentials
    namespace: kubevirt-prow-jobs
  - name: bazel-cache-gcs
    namespace: kubevirt-prow-jobs
    files:
      - secrets/tokens/google/service-accounts/bazel-cache/bazel-cache-sa.json
    type: Opaque
  - name: virtci-gcs
    namespace: kubevirt-prow-jobs
    files:
      - virtci-service-account.json=secrets/tokens/google/service-accounts/virtualization-ci/virtualization-ci-sa.json
    type: Opaque
  - name: hmac-token
    files:
      - hmac=secrets/prow/github/hmac-token
    type: Opaque
  - name: slack-token
    files:
      - token=secrets/slack/kubevirtci-token
    type: Opaque
  - name: cookie
    files:
      - secret=secrets/prow/cookie
    type: Opaque
  - name: github-oauth-config
    files:
      - secret=secrets/github-oauth-config
    type: Opaque
  - name: kubeconfig
    files:
      - config=secrets/kubeconfig
    type: Opaque

  - name: kubevirtci-quay-credential
    namespace: kubevirt-prow-jobs
    files:
      - secrets/creds/quay.io/kubevirtcibot/username
      - secrets/creds/quay.io/kubevirtcibot/password
      - secrets/creds/quay.io/kubevirtcibot/token
    type: Opaque

  - name: quay-kubevirt-push
    namespace: kubevirt-prow-jobs
    files:
      - secrets/creds/quay.io/kubevirt+prow-push/username
      - secrets/creds/quay.io/kubevirt+prow-push/password
    type: Opaque

  - name: quay-kubevirtci-push
    namespace: kubevirt-prow-jobs
    files:
      - secrets/creds/quay.io/kubevirtci+prow-push/username
      - secrets/creds/quay.io/kubevirtci+prow-push/password
    type: Opaque

  - name: quay-containerdisks-push
    namespace: kubevirt-prow-jobs
    files:
      - secrets/creds/quay.io/containerdisks+prow-push/username
      - secrets/creds/quay.io/containerdisks+prow-push/password
    type: Opaque

  - &kubevirt_commenter_bot_token
    name: commenter-oauth-token
    files:
      - oauth=secrets/tokens/github/kubevirt-commenter-bot/prow-2026-11
    type: Opaque
  - <<: *kubevirt_commenter_bot_token
    namespace: kubevirt-prow-jobs

  - name: kubevirtci-coveralls-token
    namespace: kubevirt-prow-jobs
    files:
      - token=secrets/tokens/coveralls/kubevirt/repo
    type: Opaque
  - name: containerized-data-importer-coveralls-token
    namespace: kubevirt-prow-jobs
    files:
      - token=secrets/tokens/coveralls/containerized-data-importer/repo
    type: Opaque
  - name: kubevirtci-fossa-token
    namespace: kubevirt-prow-jobs
    files:
      - token=secrets/tokens/fossa/kubevirt/push
    type: Opaque
