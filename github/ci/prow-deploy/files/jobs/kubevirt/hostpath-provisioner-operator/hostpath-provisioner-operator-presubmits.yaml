presubmits:
  kubevirt/hostpath-provisioner-operator:
  - name: pull-hostpath-provisioner-operator-unit-test
    cluster: kubevirt-prow-control-plane
    annotations:
      fork-per-release: "true"
    always_run: true
    skip_report: false
    optional: false
    decoration_config:
      timeout: 1h
      grace_period: 5m
    labels:
      preset-podman-in-container-enabled: "true"
      preset-docker-mirror-proxy: "true"
    spec:
      containers:
        - image: quay.io/kubevirtci/golang:v20261116-94a0485
          command:
            - "/usr/local/bin/runner.sh"
            - "/bin/sh"
            - "-c"
            - "./hack/run-unit-tests.sh"
          # docker-in-docker needs privileged mode
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "4Gi"
  - name: pull-hostpath-provisioner-operator-unit-test-s390x
    skip_branches:
      - release-v\d+\.\d+
    cluster: prow-s390x-workloads
    annotations:
      fork-per-release: "true"
    # TODO: revert once the prow-s390x-workloads cluster is healthy
    always_run: false
    skip_report: false
    optional: true
    decoration_config:
      timeout: 1h
      grace_period: 5m
    labels:
      preset-podman-in-container-enabled: "true"
    spec:
      containers:
        - image: quay.io/kubevirtci/golang:v20261116-94a0485
          command:
            - "/usr/local/bin/runner.sh"
            - "/bin/sh"
            - "-c"
            - "./hack/run-unit-tests.sh"
          # docker-in-docker needs privileged mode
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "4Gi"
