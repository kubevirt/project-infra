- name: periodic-kubevirt-plugins-hook-proto-drift
  cron: "47 6 * * *"
  annotations:
    testgrid-dashboards: kubevirt-plugins-periodics
    testgrid-days-of-results: "60"
  decoration_config:
    timeout: 30m
    grace_period: 5m
  max_concurrency: 1
  extra_refs:
    - org: kubevirt
      repo: plugins
      base_ref: main
      workdir: true
      clone_depth: 1
  cluster: kubevirt-prow-control-plane
  spec:
    containers:
      - image: quay.io/kubevirtci/golang:v20261012-6b466e3
        command:
          - "/usr/local/bin/runner.sh"
          - "/bin/sh"
          - "-c"
          - "hack/verify-proto.sh"
        env:
          - name: KUBEVIRT_PROTO_REF
            value: "main"
        resources:
          requests:
            memory: "1Gi"
