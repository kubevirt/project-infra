  # Jobs related to KubeVirt Prow in-house external plugins
  - name: pull-project-infra-test-external-plugins
    run_if_changed: "external-plugins/.*|go.mod"
    cluster: kubevirt-prow-control-plane
    spec:
      containers:
        - image: quay.io/kubevirtci/golang:v20260830-8316684
          command: [/usr/local/bin/entrypoint.sh]
          args:
            - /bin/bash
            - -ceu
            - go test ./external-plugins/...
          env:
            - name: GO_MOD_PATH
              value: go.mod
          resources:
            requests:
              memory: 4Gi
            limits:
              memory: 4Gi
  - &build_prow_plugin_image_job
    name: build-prow-plugin-coverage-image
    run_if_changed: "external-plugins/coverage/.*|pkg/.*|go.mod|go.sum"
    cluster: kubevirt-prow-control-plane
    labels:
       preset-docker-mirror-proxy: "true"
       preset-podman-in-container-enabled: "true"
    spec:
      containers:
        - &build_prow_plugin_image_container
          image: quay.io/kubevirtci/bootstrap:v20260830-8316684
          command: [/usr/local/bin/entrypoint.sh]
          args:
            - /bin/bash
            - -ceu
            - make -f external-plugins/Makefile image PROW_PLUGIN="${PROW_PLUGIN}"
          env:
            - name: PROW_PLUGIN
              value: coverage
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 1Gi
          # Containerized podman requires privileged mode
          securityContext:
            privileged: true
  - <<: *build_prow_plugin_image_job
    name: build-prow-plugin-phased-image
    run_if_changed: "external-plugins/phased/.*|pkg/.*|go.mod|go.sum"
    spec:
      containers:
        - <<: *build_prow_plugin_image_container
          env:
            - name: PROW_PLUGIN
              value: phased
  - <<: *build_prow_plugin_image_job
    name: build-prow-plugin-referee-image
    run_if_changed: "external-plugins/referee/.*|pkg/.*|go.mod|go.sum"
    spec:
      containers:
        - <<: *build_prow_plugin_image_container
          env:
            - name: PROW_PLUGIN
              value: referee
  - <<: *build_prow_plugin_image_job
    name: build-prow-plugin-rehearse-image
    run_if_changed: "external-plugins/rehearse/.*|pkg/.*|go.mod|go.sum"
    spec:
