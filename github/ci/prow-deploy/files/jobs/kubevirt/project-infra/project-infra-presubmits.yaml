            - "/bin/bash"
            - "-ce"
            - "cd images && ./publish_image.sh -b kubevirt-infra-bootstrap quay.io kubevirtci"
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "1Gi"
