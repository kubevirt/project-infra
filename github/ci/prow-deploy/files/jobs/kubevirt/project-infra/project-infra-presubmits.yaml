presubmits:
  kubevirt/project-infra:
  - name: check-prow-config
    # Check Prow configuration using the `checkconfig` tool:
    # - https://docs.prow.k8s.io/docs/components/cli-tools/checkconfig/
    always_run: true
    cluster: kubevirt-prow-control-plane
    labels:
      preset-gcs-credentials: "true"
    spec:
      containers:
      - image: us-docker.pkg.dev/k8s-infra-prow/images/checkconfig:v20260827-69388fecc
        command:
        - /ko-app/checkconfig
        args:
        - --config-path=github/ci/prow-deploy/files/config.yaml
        - --job-config-path=github/ci/prow-deploy/files/jobs
        - --plugin-config=github/ci/prow-deploy/files/plugins.yaml
        - --strict
        - --include-default-warnings
        - --warnings=unknown-fields-all
        resources:
          requests:
            memory: "500Mi"
        securityContext: &unprivileged_sc
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
  - name: pull-project-infra-test-robots
    run_if_changed: "robots/.*|pkg/.*|go.mod|go.sum"
    optional: false
    cluster: kubevirt-prow-control-plane
    spec:
      containers:
      - image: quay.io/kubevirtci/golang:v20260830-8316684
        command:
        - "/usr/local/bin/entrypoint.sh"
        - "/bin/sh"
        - "-ce"
        - |
          go test ./robots/... ./pkg/...
        env:
        - name: GO_MOD_PATH
          value: go.mod
        - name: GOFLAGS
          value: "-mod=vendor"
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "4Gi"
  - name: pull-project-infra-check-presubmits
    run_if_changed: "github/ci/prow-deploy/files/jobs/kubevirt/kubevirt/kubevirt-presubmits.yaml"
    cluster: kubevirt-prow-control-plane
    spec:
      containers:
      - image: quay.io/kubevirtci/golang:v20260830-8316684
        command:
        - "/usr/local/bin/entrypoint.sh"
        - "/bin/sh"
        - "-ce"
        - |
          go run ./robots/kubevirt check presubmits \
           --job-config-path-kubevirt-presubmits=github/ci/prow-deploy/files/jobs/kubevirt/kubevirt/kubevirt-presubmits.yaml \
           --github-token-path='' \
           --dry-run=false
        env:
        - name: GO_MOD_PATH
          value: go.mod
        - name: GOFLAGS
          value: "-mod=vendor"
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "4Gi"
  - name: pull-project-infra-test-releng
    run_if_changed: "releng/.*|go.mod"
    optional: false
    cluster: kubevirt-prow-control-plane
    spec:
      containers:
      - image: quay.io/kubevirtci/golang:v20260830-8316684
        command:
        - "/usr/local/bin/entrypoint.sh"
        - "/bin/sh"
        - "-ce"
        - |
          go test ./releng/...
        env:
        - name: GO_MOD_PATH
          value: go.mod
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "4Gi"
  - name: pull-project-infra-test-github-ci-services
    run_if_changed: "github/ci/services/.*|go.mod"
    optional: false
    cluster: kubevirt-prow-control-plane
    spec:
      containers:
      - image: quay.io/kubevirtci/golang:v20260830-8316684
        command:
        - "/usr/local/bin/entrypoint.sh"
        - "/bin/sh"
        - "-ce"
        - |
          go build ./github/ci/services/...
        env:
        - name: GO_MOD_PATH
          value: go.mod
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "4Gi"
        securityContext:
          runAsUser: 0
  - always_run: true
    cluster: kubevirt-prow-control-plane
    name: pull-project-infra-lint
    spec:
      containers:
      - command:
        - "/usr/local/bin/entrypoint.sh"
        - "/bin/sh"
        - "-ce"
        - |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b ${GOPATH}/bin ${GOLANGCI_LINT_VERSION}
          make lint
        env:
        - name: GO_MOD_PATH
          value: go.mod
        - name: GOLANGCI_LINT_VERSION
          value: "v2.12.2"
        image: quay.io/kubevirtci/golang:v20260830-8316684
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "4Gi"
  - name: build-kubevirt-infra-bootstrap-image
    always_run: false
    run_if_changed: "images/kubevirt-infra-bootstrap/.*"
    labels:
      preset-podman-in-container-enabled: "true"
      preset-docker-mirror-proxy: "true"
      preset-kubevirtci-quay-credential: "true"
    cluster: kubevirt-prow-control-plane
