              value: test-subset
  - name: pull-project-infra-prow-deploy-test
    always_run: false
    run_if_changed: "github/ci/prow-deploy/(defaults|hack|kustom|tasks|templates|vars)/.*|github/ci/prow-deploy/files/[^/]+$|github/ci/prow-deploy/[^/]+$"
    labels:
