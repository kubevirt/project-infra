presubmits:
  kubevirt/secrets:
  - always_run: false
    skip_if_only_changed: .*\.md
    cluster: kubevirt-prow-control-plane
    decoration_config:
      github_app_id: "3260091"
      github_app_private_key_secret:
        name: github-token
        key: cert
    extra_refs:
    - base_ref: main
      org: kubevirt
      repo: project-infra
    labels:
      preset-pgp-bot-key: "true"
    name: pull-secrets-check-secrets-decrypt
    spec:
      containers:
      - image: quay.io/kubevirtci/prow-deploy:v202611170122-482cd96
        command: [ "/bin/bash", "-ce" ]
        args:
        - |
          source ../project-infra/hack/manage-secrets.sh
          decrypt_secrets
          cleanup_secrets
        env:
        - name: GIT_ASKPASS
          value: ../project-infra/hack/git-askpass.sh
        volumeMounts:
        - name: github-bot-token
          mountPath: /etc/github
          readOnly: true
      volumes:
      # Volume from preset-github-credentials conflicts with volume automatically
      # defined by the `github_app_private_key_secret` decoration.
      - name: github-bot-token
        secret:
          secretName: github-token
          items:
          - key: token
            path: token
            mode: 0400
