periodics:
- name: periodic-koc-test
  cron: "17 3 * * *"
  annotations:
    testgrid-create-test-group: "false"
  decoration_config:
    timeout: 1h
    grace_period: 5m
  max_concurrency: 1
  extra_refs:
  - org: kubevirt
    repo: kubevirt-observability-controller
    base_ref: main
    workdir: true
    clone_depth: 1
  cluster: kubevirt-prow-control-plane
  spec:
    containers:
      - image: quay.io/kubevirtci/golang:v20260715-af3e234
        command:
          - "/usr/local/bin/runner.sh"
          - "/bin/sh"
          - "-c"
          - |
            make test &&
            make vulncheck
        resources:
          requests:
            memory: "4Gi"
- name: periodic-koc-functest
  cron: "43 3 * * *"
  annotations:
    testgrid-create-test-group: "false"
  decoration_config:
    timeout: 5h
    grace_period: 5m
  max_concurrency: 1
  extra_refs:
  - org: kubevirt
    repo: kubevirt-observability-controller
    base_ref: main
    workdir: true
    clone_depth: 1
  labels:
    preset-podman-in-container-enabled: "true"
    preset-docker-mirror-proxy: "true"
    preset-shared-images: "true"
  cluster: prow-workloads
  spec:
    nodeSelector:
      type: bare-metal-external
    containers:
      - image: quay.io/kubevirtci/golang:v20260715-af3e234
        command:
          - "/usr/local/bin/runner.sh"
          - "/bin/sh"
          - "-c"
          - "automation/test.sh"
        securityContext:
          privileged: true
        resources:
          requests:
            memory: "52Gi"
